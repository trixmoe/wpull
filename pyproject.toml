[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "wpull"
dynamic = ["version", "readme"]
description = "Wget-compatible web downloader and crawler."
authors = [
    {name = "Christopher Foo", email = "chris.foo@gmail.com"},
]
license = "GPL-3.0-only"
classifiers=[
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Archiving",
]
requires-python = ">=3.9,<3.10"
dependencies = [
    "chardet==5.0.0",
    "dnspython<2",
    "frozendict>=2.4.6",
    "html5lib==1.1",
    "lxml==5.2.1",
    "psutil>5,<6",
    "sqlalchemy>=1.3,<1.4",
    "tornado>=3.2.2,<5.0",
    "yapsy==1.12.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.uv]
default-groups = "all"

[tool.setuptools]
# TODO: use src layout and drop packages listing
packages = [
    "wpull",
    "wpull.application",
    "wpull.application.plugins",
    "wpull.application.tasks",
    "wpull.backport",
    "wpull.database",
    "wpull.document",
    "wpull.document.htmlparse",
    "wpull.driver",
    "wpull.network",
    "wpull.pipeline",
    "wpull.processor",
    "wpull.processor.coprocessor",
    "wpull.protocol.abstract",
    "wpull.protocol.ftp",
    "wpull.protocol.ftp.ls",
    "wpull.protocol.http",
    "wpull.proxy",
    "wpull.scraper",
    "wpull.testing",
    "wpull.testing.integration",
    "wpull.thirdparty",
    "wpull.warc",
]

[project.scripts]
wpull = "wpull.application.main:main"
wpull3 = "wpull.application.main:main"

[tool.setuptools.dynamic]
readme = {file = ["README.rst"]}
version = {attr = "wpull.version.__version__"}
